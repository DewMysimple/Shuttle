<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8e7de" />
    <title>兰花 · 3D 时间切片</title>
  </head>
  <body>
    <main class="single-interface">
      <section id="time-slices" class="slice-section" aria-label="兰花三维时间切片">
        <div class="slice-stage">
          <div class="stage-header">
            <div>
              <p class="kicker">Interactive 3D time slice</p>
              <p class="stage-header__title">兰花 / 形态 01</p>
            </div>
            <div class="stage-header__meta">
              <span id="frame-counter">FRAME 01 / 76</span>
              <span id="stage-status">准备载入</span>
            </div>
          </div>

          <canvas id="scene" tabindex="0" aria-label="时间切片三维场景，可滚动切换帧，并拖拽自由旋转"></canvas>

          <div class="loading-panel" id="loading-panel" role="status" aria-live="polite">
            <div class="loading-panel__topline">
              <span>正在准备花的时间轴</span>
              <span id="loading-percent">0%</span>
            </div>
            <div class="loading-bar"><span id="loading-bar-fill"></span></div>
            <p id="loading-detail">载入 3D 模型与时间切片</p>
          </div>

          <div class="stage-footer">
            <div class="stage-footer__instruction">
              <span class="gesture-icon" aria-hidden="true">↔</span>
              <span>Drag to rotate 360° / unfold</span>
            </div>
            <button class="expand-button" id="expand-button" type="button" aria-pressed="false">
              展开切片
            </button>
            <span>scroll / drag / explore</span>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
