<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4d8cf" />
    <title>蝴蝶时间切片</title>
  </head>
  <body>
    <main class="single-interface">
      <section id="time-slices" class="slice-section" aria-label="蝴蝶真实逐帧时间切片">
        <div class="slice-stage">
          <header class="stage-header">
            <div class="stage-title">
              <p class="kicker">91 moments in flight</p>
              <h1>蝴蝶 / 时间切片</h1>
            </div>
            <div class="stage-header__meta" aria-live="polite">
              <span id="frame-counter">FRAME 001 / 091</span>
              <span id="stage-status">准备载入</span>
            </div>
          </header>

          <canvas
            id="scene"
            tabindex="0"
            aria-label="蝴蝶时间切片场景。滚轮逐帧穿梭，左键径向拖拽展开或收拢，右键拖拽检查侧视角，按住 Control 或 Command 滚轮缩放。"
          ></canvas>

          <div class="loading-panel" id="loading-panel" role="status" aria-live="polite">
            <div class="loading-panel__topline">
              <span>正在排列真实时间切片</span>
              <span id="loading-percent">0%</span>
            </div>
            <div class="loading-bar"><span id="loading-bar-fill"></span></div>
            <p id="loading-detail">读取 91 个逐帧姿态</p>
          </div>

          <nav class="playback-controls" aria-label="时间穿梭控制">
            <button
              class="playback-button"
              id="play-forward"
              type="button"
              data-playback-direction="1"
              aria-pressed="false"
              aria-label="沿时间轨道向后穿梭，再次点击暂停"
            >正向</button>
            <button
              class="playback-button"
              id="play-reverse"
              type="button"
              data-playback-direction="-1"
              aria-pressed="false"
              aria-label="沿时间轨道向前穿梭，再次点击暂停"
            >反向</button>
            <span class="control-rule" aria-hidden="true"></span>
            <button class="playback-button playback-button--quiet" id="jump-start" type="button" aria-label="穿梭到首帧">01</button>
            <button class="playback-button playback-button--quiet" id="jump-end" type="button" aria-label="穿梭到尾帧">91</button>
          </nav>

          <footer class="stage-footer">
            <div class="stage-footer__instruction">
              <span class="gesture-icon" aria-hidden="true"><i></i></span>
              <span>滚轮逐帧穿梭</span>
              <span class="instruction-separator">/</span>
              <span>左键径向拖拽展开</span>
              <span class="instruction-separator">/</span>
              <span>右键拖拽侧视</span>
            </div>
            <button class="expand-button" id="expand-button" type="button" aria-pressed="false">
              展开 91 帧
            </button>
          </footer>

          <div class="timeline-readout" aria-hidden="true">
            <span id="timeline-progress"></span>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
